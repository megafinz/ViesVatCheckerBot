# Development overrides for docker-compose.yml. Published ports and dev-friendly
# defaults only — never use this file as the production deployment source of truth.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile admin up
#
# This file does NOT redefine services — it only adds `ports:` mappings and dev
# overrides so the stack is reachable from the host without running each app
# locally with `bun run dev:*`.

services:
  db:
    ports:
      - "54329:5432"

  backend:
    environment:
      NODE_ENV: development
    ports:
      - "8080:8080"

  admin-web:
    ports:
      - "3000:3000"
