services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: viesvatchecker
      POSTGRES_PASSWORD: viesvatchecker
      POSTGRES_USER: viesvatchecker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viesvatchecker -d viesvatchecker"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
